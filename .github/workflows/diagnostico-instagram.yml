name: Diagnóstico Instagram

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Testar acesso à API do Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: "17841423969682571"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ.get("INSTAGRAM_ACCESS_TOKEN", "").strip()
          user_id = os.environ["INSTAGRAM_USER_ID"]

          if not token:
              print("ERRO: o segredo INSTAGRAM_ACCESS_TOKEN está vazio ou ausente.")
              raise SystemExit(1)

          params = urllib.parse.urlencode({
              "fields": "id,username",
              "access_token": token
          })

          url = f"https://graph.instagram.com/v26.0/{user_id}?{params}"
          request = urllib.request.Request(url, method="GET")

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  print("SUCESSO: a API respondeu.")
                  print("ID do perfil:", result.get("id", "não informado"))
                  print("Nome de usuário:", result.get("username", "não informado"))

          except urllib.error.HTTPError as error:
              print("ERRO HTTP:", error.code)

              try:
                  details = json.loads(error.read().decode("utf-8"))
                  api_error = details.get("error", {})
                  print("Mensagem:", api_error.get("message", "não informada"))
                  print("Código:", api_error.get("code", "não informado"))
                  print("Subcódigo:", api_error.get("error_subcode", "não informado"))
              except Exception:
                  print("Não foi possível ler os detalhes do erro.")

              raise SystemExit(1)

          except Exception as error:
              print("Falha de conexão:", type(error).__name__)
              raise SystemExit(1)
          PY

name: Gerar artigos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-artigo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Gerar artigo com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import urllib.request
          import urllib.error

          with open("config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          with open("temas.json", "r", encoding="utf-8") as f:
              temas = json.load(f)

          tema = random.choice(temas["temas"])

          prompt = f"""
          Você é o redator do blog Salário Capital.

          Escreva um artigo original em português do Brasil sobre:

          {tema}

          O público é formado principalmente por pequenos investidores e pessoas
          que querem melhorar sua vida financeira.

          Regras:

          - O artigo deve ter aproximadamente 1.000 a 1.500 palavras.
          - Use linguagem simples, clara e profissional.
          - Não invente dados, estatísticas, taxas, leis ou informações.
          - Não faça promessas de lucro.
          - Não dê recomendações financeiras personalizadas.
          - O artigo deve ser útil e educativo.
          - Evite introduções genéricas.
          - Não use emojis.
          - Não coloque HTML.
          - Não coloque Markdown.
          - Crie uma introdução de aproximadamente 2 a 3 parágrafos.
          - Depois da introdução, desenvolva o assunto com 4 a 7 subtítulos.
          - Cada subtítulo deve ser curto, claro e descritivo.
          - Cada seção deve ter 1 a 3 parágrafos.
          - Termine com uma conclusão objetiva.

          Retorne SOMENTE um JSON válido neste formato:

          {{
            "titulo": "Título do artigo",
            "introducao": [
              "Primeiro parágrafo da introdução.",
              "Segundo parágrafo da introdução."
            ],
            "secoes": [
              {{
                "subtitulo": "Primeiro subtítulo",
                "texto": [
                  "Primeiro parágrafo da seção.",
                  "Segundo parágrafo da seção."
                ]
              }}
            ],
            "conclusao": [
              "Primeiro parágrafo da conclusão."
            ]
          }}
          """

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent"

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"]
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  resultado = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("ERRO HTTP:", e.code)
              print(e.read().decode("utf-8"))
              raise

          texto = resultado["candidates"][0]["content"]["parts"][0]["text"].strip()

          if texto.startswith("```json"):
              texto = texto[7:]

          if texto.endswith("```"):
              texto = texto[:-3]

          texto = texto.strip()
          artigo = json.loads(texto)

          introducao_html = ""

          for paragrafo in artigo["introducao"]:
              introducao_html += "<p>" + paragrafo.strip() + "</p>\n"

          secoes_html = ""

          for secao in artigo["secoes"]:
              secoes_html += "<h2>" + secao["subtitulo"].strip() + "</h2>\n"

              for paragrafo in secao["texto"]:
                  secoes_html += "<p>" + paragrafo.strip() + "</p>\n"

          conclusao_html = ""

          for paragrafo in artigo["conclusao"]:
              conclusao_html += "<p>" + paragrafo.strip() + "</p>\n"

          imagem_url = (
              "https://salario-capital.github.io/"
              "salario-capital/imagens/artigo_atual.svg"
          )

          imagem_html = (
              '<p style="text-align:center;margin:0 0 25px 0;">'
              f'<img src="{imagem_url}" '
              'alt="Imagem ilustrativa do artigo" '
              'style="width:100%;height:auto;display:block;margin:0 auto;">'
              '</p>\n'
          )

          html = (
              imagem_html
              + introducao_html
              + "\n<!--more-->\n\n"
              + secoes_html
              + "\n<h2>Conclusão</h2>\n"
              + conclusao_html
          )

          try:
              with open("artigos.json", "r", encoding="utf-8") as f:
                  historico = json.load(f)
          except FileNotFoundError:
              historico = {"artigos": []}

          historico["artigos"].append({
              "titulo": artigo["titulo"],
              "tema": tema,
              "conteudo": html
          })

          with open("artigos.json", "w", encoding="utf-8") as f:
              json.dump(
                  historico,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open("artigo_atual.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "titulo": artigo["titulo"],
                      "tema": tema,
                      "conteudo": html
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Artigo gerado com sucesso!")
          print("Tema:", tema)
          print("Título:", artigo["titulo"])
          print("Imagem incluída antes da introdução.")
          print("Marcador de expansão inserido após a introdução.")
          print("Subtítulos estruturados como H2.")
          PY

      - name: Gerar imagem do artigo
        run: |
          python gerar_imagem.py

      - name: Preparar imagem JPG para Instagram
        run: |
          python -m pip install --quiet cairosvg pillow

          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO

          png_bytes = cairosvg.svg2png(
              url="imagens/artigo_atual.svg",
              output_width=1080
          )

          imagem = Image.open(BytesIO(png_bytes)).convert("RGB")
          imagem.save(
              "imagens/artigo_atual.jpg",
              format="JPEG",
              quality=90,
              optimize=True
          )

          print("Imagem JPG preparada para o Instagram.")
          PY

      - name: Salvar imagem no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add imagens/artigo_atual.svg imagens/artigo_atual.jpg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas imagens."
          else
            git commit -m "Atualizar imagens do artigo"
            git push
          fi

          echo "Aguardando atualização do GitHub Pages..."
          sleep 30

      - name: Publicar artigo no Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python -m pip install --quiet google-auth google-api-python-client

          python - <<'PY'
          import json
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          with open("artigo_atual.json", "r", encoding="utf-8") as f:
              artigo = json.load(f)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["BLOGGER_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["BLOGGER_CLIENT_ID"],
              client_secret=os.environ["BLOGGER_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/blogger"]
          )

          blogger = build(
              "blogger",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          postagem = {
              "kind": "blogger#post",
              "title": artigo["titulo"],
              "content": artigo["conteudo"]
          }

          resultado = blogger.posts().insert(
              blogId=os.environ["BLOGGER_BLOG_ID"],
              body=postagem,
              isDraft=False
          ).execute()

          print("ARTIGO PUBLICADO COM SUCESSO!")
          print("Título:", resultado.get("title"))
          print("ID da postagem:", resultado.get("id"))
          print("URL:", resultado.get("url"))
          PY

      - name: Publicar artigo no Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: "17841423969682571"
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ.get("INSTAGRAM_ACCESS_TOKEN", "").strip()
          user_id = os.environ["INSTAGRAM_USER_ID"]
          base_url = "https://graph.instagram.com/v26.0"

          if not token:
              print("ERRO: segredo INSTAGRAM_ACCESS_TOKEN não encontrado.")
              sys.exit(1)

          with open("artigo_atual.json", "r", encoding="utf-8") as f:
              artigo = json.load(f)

          titulo = artigo["titulo"].strip()
          tema = artigo["tema"].strip()

          image_url = (
              "https://salario-capital.github.io/"
              "salario-capital/imagens/artigo_atual.jpg"
          )

          caption = (
              f"💡 {titulo}\n\n"
              f"Neste artigo do Salário Capital, exploramos {tema.lower()} "
              "com informações para ajudar você a tomar decisões financeiras "
              "mais conscientes.\n\n"
              "Leia o artigo completo: link do blog na bio!\n\n"
              "#SalarioCapital #EducaçãoFinanceira "
              "#FinançasPessoais #Investimentos"
          )

          def request_api(url, fields=None):
              if fields is not None:
                  body = urllib.parse.urlencode(fields).encode("utf-8")
                  req = urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/x-www-form-urlencoded"
                      },
                      method="POST"
                  )
              else:
                  req = urllib.request.Request(url, method="GET")

              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              print("Etapa 1/3: criando o contêiner da imagem...")
              media = request_api(
                  f"{base_url}/{user_id}/media",
                  {
                      "image_url": image_url,
                      "caption": caption,
                      "access_token": token
                  }
              )

              creation_id = media.get("id")
              if not creation_id:
                  raise RuntimeError(
                      "A API não retornou o ID do contêiner."
                  )

              print("Etapa 2/3: aguardando o processamento da imagem...")

              for tentativa in range(1, 19):
                  params = urllib.parse.urlencode({
                      "fields": "status_code,status",
                      "access_token": token
                  })
                  status_url = f"{base_url}/{creation_id}?{params}"
                  result = request_api(status_url)
                  status = result.get("status_code", "DESCONHECIDO")

                  print(f"Verificação {tentativa}/18: {status}")

                  if status == "FINISHED":
                      break

                  if status in ("ERROR", "EXPIRED"):
                      print(
                          "Erro no processamento:",
                          result.get("status", "não informado")
                      )
                      sys.exit(1)

                  time.sleep(10)
              else:
                  print("A imagem não ficou pronta após 3 minutos.")
                  sys.exit(1)

              print("Etapa 3/3: publicando no Instagram...")
              published = request_api(
                  f"{base_url}/{user_id}/media_publish",
                  {
                      "creation_id": creation_id,
                      "access_token": token
                  }
              )

              post_id = published.get("id")
              if not post_id:
                  raise RuntimeError(
                      "A API não confirmou o ID da publicação."
                  )

              print("PUBLICAÇÃO NO INSTAGRAM CONCLUÍDA COM SUCESSO.")
              print("Título:", titulo)
              print("ID da publicação:", post_id)

          except urllib.error.HTTPError as error:
              print("A API retornou erro HTTP:", error.code)
              try:
                  details = json.loads(error.read().decode("utf-8"))
                  api_error = details.get("error", {})
                  print(
                      "Mensagem:",
                      api_error.get("message", "Erro não detalhado")
                  )
                  print("Código:", api_error.get("code", "não informado"))
                  print(
                      "Subcódigo:",
                      api_error.get("error_subcode", "não informado")
                  )
              except Exception:
                  print("Não foi possível interpretar o erro da API.")
              sys.exit(1)

          except Exception as error:
              print("Falha durante a publicação:", type(error).__name__)
              print(str(error))
              sys.exit(1)
          PY

      - name: Salvar artigo no repositório
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artigos.json artigo_atual.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Adicionar artigo gerado automaticamente"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          fi

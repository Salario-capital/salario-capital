
      - name: Salvar imagem no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add imagens/*.svg imagens/*.jpg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas imagens."
          else
            git commit -m "Salvar imagens exclusivas do artigo"
            git push
          fi

          echo "Aguardando atualização do GitHub Pages..."
          sleep 30

          python - <<'PY'
          import json
          import os
          import urllib.request

          with open("artigo_atual.json", "r", encoding="utf-8") as f:
              artigo = json.load(f)

          for chave in ("imagem_svg_url", "imagem_jpg_url"):
              url = artigo[chave]
              print("Verificando:", url)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"Cache-Control": "no-cache"},
                      method="GET"
                  )
                  with urllib.request.urlopen(req, timeout=30) as resposta:
                      print("HTTP:", resposta.status)
                      print("Content-Type:", resposta.headers.get("Content-Type"))
              except Exception as erro:
                  raise RuntimeError(
                      f"A imagem ainda não está acessível: {url}"
                  ) from erro

          print("Imagens exclusivas verificadas.")
          PY

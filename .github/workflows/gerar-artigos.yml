
      - name: Preparar imagem JPG para Instagram
        run: |
          python -m pip install --quiet cairosvg pillow

          python - <<'PY'
          import json
          import cairosvg
          from PIL import Image
          from io import BytesIO
          import os

          with open("artigo_atual.json", "r", encoding="utf-8") as f:
              artigo = json.load(f)

          svg_path = artigo["imagem_svg_arquivo"]
          jpg_path = artigo["imagem_jpg_arquivo"]

          os.makedirs(os.path.dirname(jpg_path), exist_ok=True)

          png_bytes = cairosvg.svg2png(
              url=svg_path,
              output_width=1080
          )

          imagem = Image.open(BytesIO(png_bytes)).convert("RGB")

          imagem.save(
              jpg_path,
              format="JPEG",
              quality=90,
              optimize=True
          )

          # Mantém uma cópia com o nome antigo por compatibilidade.
          imagem.save(
              "imagens/artigo_atual.jpg",
              format="JPEG",
              quality=90,
              optimize=True
          )

          print("JPG exclusivo criado:", jpg_path)
          print("Cópia de compatibilidade criada: imagens/artigo_atual.jpg")
          PY

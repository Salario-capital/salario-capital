```yaml
name: Gerar artigos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-artigo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Gerar artigo com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"]

          with open("config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          with open("temas.json", "r", encoding="utf-8") as f:
              temas = json.load(f)

          prompt = f"""
          Você é o redator do blog Salário Capital.

          Escreva um artigo completo em português do Brasil sobre um dos seguintes temas:
          {temas}

          O artigo deve ter entre 1000 e 1500 palavras.

          Regras:
          - Linguagem simples, clara e profissional.
          - Público formado principalmente por pequenos investidores e pessoas interessadas em educação financeira.
          - Não invente dados, números, leis ou informações.
          - Não use HTML.
          - Não use Markdown.
          - Crie uma introdução objetiva.
          - Crie de 4 a 7 seções com subtítulos.
          - Termine com uma conclusão prática.
          - Não coloque emojis.
          - O conteúdo deve ser original e útil.

          Retorne SOMENTE um JSON válido neste formato:

          {{
            "titulo": "Título do artigo",
            "introducao": "Texto da introdução",
            "secoes": [
              {{
                "titulo": "Subtítulo",
                "texto": "Texto da seção"
              }}
            ],
            "conclusao": "Texto da conclusão"
          }}
          """

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash-lite:generateContent"
              f"?key={api_key}"
          )

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              resultado = json.loads(response.read().decode("utf-8"))

          texto = resultado["candidates"][0]["content"]["parts"][0]["text"]

          texto = texto.strip()

          if texto.startswith("```"):
              texto = texto.replace("```json", "", 1)
              texto = texto.replace("```", "")
              texto = texto.strip()

          artigo = json.loads(texto)

          with open("artigo_atual.json", "w", encoding="utf-8") as f:
              json.dump(artigo, f, ensure_ascii=False, indent=2)

          print("ARTIGO GERADO COM SUCESSO!")
          print("Título:", artigo["titulo"])
          PY

      - name: Gerar imagem do artigo
        run: |
          python gerar_imagem.py

      - name: Preparar artigo para o Blogger
        run: |
          python - <<'PY'
          import json
          import html

          with open("artigo_atual.json", "r", encoding="utf-8") as f:
              artigo = json.load(f)

          titulo = artigo["titulo"]
          introducao = artigo["introducao"]

          imagem_url = (
              "https://salario-capital.github.io/"
              "salario-capital/imagens/artigo_atual.svg"
          )

          conteudo = ""

          # Imagem
          conteudo += (
              '<p style="text-align:center;">'
              f'<img src="{imagem_url}" '
              'alt="Imagem ilustrativa do artigo" '
              'style="width:100%;height:auto;display:block;margin:0 auto 25px auto;">'
              '</p>'
          )

          # Introdução
          conteudo += f"<p>{html.escape(introducao)}</p>"

          # Leia mais
          conteudo += "<!--more-->"

          # Seções
          for secao in artigo["secoes"]:
              conteudo += f"<h2>{html.escape(secao['titulo'])}</h2>"
              conteudo += f"<p>{html.escape(secao['texto'])}</p>"

          # Conclusão
          conteudo += "<h2>Conclusão</h2>"
          conteudo += f"<p>{html.escape(artigo['conclusao'])}</p>"

          artigo_blogger = {
              "titulo": titulo,
              "conteudo": conteudo
          }

          with open("artigo_blogger.json", "w", encoding="utf-8") as f:
              json.dump(
                  artigo_blogger,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("ARTIGO PREPARADO PARA O BLOGGER!")
          print("Imagem:", imagem_url)
          PY

      - name: Publicar artigo no Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python -m pip install --quiet google-auth google-api-python-client

          python - <<'PY'
          import json
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          with open("artigo_blogger.json", "r", encoding="utf-8") as f:
              artigo = json.load(f)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["BLOGGER_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["BLOGGER_CLIENT_ID"],
              client_secret=os.environ["BLOGGER_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/blogger"]
          )

          blogger = build(
              "blogger",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          postagem = {
              "kind": "blogger#post",
              "title": artigo["titulo"],
              "content": artigo["conteudo"]
          }

          resultado = blogger.posts().insert(
              blogId=os.environ["BLOGGER_BLOG_ID"],
              body=postagem,
              isDraft=False
          ).execute()

          print("ARTIGO PUBLICADO COM SUCESSO!")
          print("Título:", resultado.get("title"))
          print("ID da postagem:", resultado.get("id"))
          print("URL:", resultado.get("url"))
          PY

      - name: Salvar arquivos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artigo_atual.json artigo_blogger.json imagens/artigo_atual.svg

          git commit -m "Gerar artigo e imagem" || echo "Nenhuma alteração para salvar"

          git push
```

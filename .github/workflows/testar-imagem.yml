name: Testar geração de imagem

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar-imagem:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Gerar imagem
        run: |
          python gerar_imagem.py

      - name: Salvar imagem no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/artigo_atual.svg
          git commit -m "Teste de geração de imagem" || echo "Nenhuma alteração para salvar"
          git push
